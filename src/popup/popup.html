<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <title>GoFully</title>
  <!-- Design: Figma "Extension UI v2" › Popup / * (see .claude/skills/gofully-ui/references/screens.md) -->
  <script src="ds/chrome-stub.js"></script>
  <link rel="stylesheet" href="ds/tokens.css">
  <link rel="stylesheet" href="ds/components.css">
  <style>
    html, body { margin: 0; }
    /* Chrome caps extension popups at 600px tall: header + footer stay fixed, main scrolls. */
    body { width: 380px; min-height: 420px; max-height: 600px; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

    /* Header */
    .hdr { display: flex; align-items: center; gap: var(--gf-s-2); padding: var(--gf-s-3) var(--gf-s-3) var(--gf-s-3) var(--gf-s-4); background: var(--gf-bg-surface); border-bottom: 1px solid var(--gf-border); }
    .brand { display: flex; align-items: center; gap: var(--gf-s-2); flex: 1; min-width: 0; }
    .brand img { width: 24px; height: 24px; border-radius: var(--gf-r-sm); }
    .hdr-right { display: flex; align-items: center; gap: 2px; }
    .hdr-right .gf-icon-btn { position: relative; }
    .tip { position: absolute; top: calc(100% + 6px); right: 0; z-index: 10; opacity: 0; transform: translateY(-2px); transition: opacity .12s, transform .12s; }
    .gf-icon-btn:hover .tip, .gf-icon-btn:focus-visible .tip { opacity: 1; transform: none; }
    .rate-us-btn { color: var(--gf-warning); }

    /* Body */
    main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: var(--gf-s-3); padding: var(--gf-s-4); overflow-y: auto; }
    .hdr, .ftr { flex: none; }

    /* Capture modes */
    #modesSection { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gf-s-3); }
    #unsupportedPanel.active ~ #modesSection { display: none !important; }
    .mode-btn { display: flex; flex-direction: column; align-items: flex-start; gap: var(--gf-s-2); min-width: 0; padding: 10px var(--gf-s-3); }
    .mode-btn .m-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .m-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .m-name { color: var(--gf-text); }
    .m-desc { color: var(--gf-text-3); }
    .mode-btn.primary { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: var(--gf-s-3); padding: 14px; }
    .mode-btn.primary .m-text { flex: 1; }
    .mode-btn.primary .m-desc { color: var(--gf-text-2); }
    .mode-btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
    .more { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: var(--gf-s-2); margin: var(--gf-s-1) 0 calc(var(--gf-s-1) * -1); color: var(--gf-text-3); }
    .more p { margin: 0; }
    .delay { display: inline-flex; align-items: center; gap: 6px; color: var(--gf-text-2); cursor: pointer; }
    .delay .gf-icon { display: inline-flex; color: var(--gf-text-3); }
    .delay-select { height: 28px; min-width: 0; width: auto; padding-block: 0; font-size: 12px; }

    /* Unsupported page */
    #unsupportedPanel { display: none; flex-direction: column; align-items: center; gap: var(--gf-s-2); padding: var(--gf-s-6) var(--gf-s-2); text-align: center; }
    #unsupportedPanel.active { display: flex; }
    #unsupportedPanel p { margin: 0 0 var(--gf-s-2); color: var(--gf-text-2); max-width: 300px; }

    /* Last capture */
    #statusLine { display: none; align-items: center; gap: 10px; padding: var(--gf-s-2) var(--gf-s-2) var(--gf-s-2) var(--gf-s-2); }
    #statusLine.active { display: flex; }
    .status-thumb { width: 44px; height: 32px; object-fit: cover; object-position: top; border-radius: var(--gf-r-xs); border: 1px solid var(--gf-border); background: var(--gf-bg-sunken); }
    .status-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--gf-text-3); }
    .status-text b { color: var(--gf-text); font-weight: 500; }

    /* Progress */
    /* While capturing the popup shrinks to a small card instead of keeping its full height. */
    body.is-capturing { min-height: 0; }
    body.is-capturing main { overflow: visible; }
    #progressSection { display: none; flex-direction: column; gap: var(--gf-s-3); padding: var(--gf-s-3) var(--gf-s-4); border: 1px solid var(--gf-border); border-radius: var(--gf-r-lg); background: var(--gf-bg-surface); box-shadow: var(--gf-shadow-xs); }
    #progressSection.active { display: flex; }
    .prog-top { display: flex; align-items: center; gap: var(--gf-s-3); }
    .prog-top .gf-tile svg { animation: prog-spin 1.1s linear infinite; }
    @keyframes prog-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .prog-top .gf-tile svg { animation: none; } }
    .prog-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .prog-text .gf-t-body-medium { font-variant-numeric: tabular-nums; }
    #progressSection .gf-progress { width: 100%; }
    #progressFill { width: 100%; transform: scaleX(0); transform-origin: left; transition: transform .25s; }

    /* Result */
    #resultBar { display: none; flex-direction: column; gap: var(--gf-s-3); }
    #resultBar.active { display: flex; }
    .popup-preview { position: relative; height: 184px; overflow: hidden; align-items: flex-start; justify-content: center; border: 1px solid var(--gf-border); border-radius: var(--gf-r-lg); background: var(--gf-bg-sunken); }
    .popup-preview img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: top; }
    .popup-preview-fade { position: absolute; inset: auto 0 0 0; height: 64px; align-items: flex-end; justify-content: center; padding-bottom: var(--gf-s-2); background: linear-gradient(transparent, var(--gf-bg-sunken)); }
    .res-status { display: flex; flex-direction: column; gap: 2px; }
    .res-status .gf-t-small { color: var(--gf-text-3); }
    .res-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .res-row .gf-btn { padding: 0 6px; }

    /* Error */
    #errorBar { display: none; }
    #errorBar.active { display: flex; }

    /* History */
    #historySection { display: none; flex-direction: column; gap: var(--gf-s-3); }
    #historySection.active { display: flex; }
    .hist-header { display: flex; align-items: center; gap: 6px; }
    .hist-title { flex: 1; }
    .hist-count { min-height: 16px; margin-top: calc(var(--gf-s-1) * -1); color: var(--gf-text-3); }
    .hist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gf-s-3); }
    .hist-item { position: relative; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--gf-border); border-radius: var(--gf-r-lg); background: var(--gf-bg-surface); transition: border-color .15s, box-shadow .15s; }
    .hist-item[role="link"] { cursor: pointer; }
    .hist-item:hover { border-color: var(--gf-border-strong); box-shadow: var(--gf-shadow-sm); }
    .hist-thumb { width: 100%; height: 96px; object-fit: cover; object-position: top; background: var(--gf-bg-sunken); border-bottom: 1px solid var(--gf-border); }
    .hist-meta { display: flex; flex-direction: column; gap: 0; padding: var(--gf-s-2) 10px; min-width: 0; }
    .hist-domain { font-size: 13px; font-weight: 500; line-height: 18px; color: var(--gf-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-time { font-size: 11px; line-height: 16px; color: var(--gf-text-3); }
    .hist-delete { position: absolute; top: 6px; right: 6px; display: none; width: 24px; height: 24px; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--gf-border); border-radius: var(--gf-r-pill); background: var(--gf-bg-surface); color: var(--gf-text-2); box-shadow: var(--gf-shadow-xs); }
    .hist-delete:hover { color: var(--gf-error); }
    .hist-item:hover .hist-delete, .hist-item:focus-within .hist-delete { display: flex; }
    .hist-empty { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: var(--gf-s-2); padding: var(--gf-s-4) var(--gf-s-3) var(--gf-s-6); text-align: center; }
    .hist-empty p { margin: 0; max-width: 280px; color: var(--gf-text-2); }

    /* Footer */
    .ftr { display: flex; align-items: center; gap: var(--gf-s-2); padding: 10px var(--gf-s-4); background: var(--gf-bg-surface); border-top: 1px solid var(--gf-border); }
    .ftr-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gf-success); }
    .ftr-text { flex: 1; color: var(--gf-text-2); }
    #ftrVersion { color: var(--gf-text-3); }

    /* Toast */
    .toast { position: fixed; left: 50%; bottom: 56px; z-index: 20; opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(6px); transition: opacity .18s, transform .18s; }
    .toast.show { opacity: 1; transform: translateX(-50%); }
  </style>
</head>
<body class="gf">
<header class="hdr">
  <div class="brand">
    <img src="assets/gofully-symbol.png" alt="">
    <span class="gf-t-heading">GoFully</span>
  </div>
  <div class="hdr-right">
    <button class="gf-icon-btn rate-us-btn" id="rateUsBtn" type="button" aria-label="Rate us">
      <i class="gf-icon" data-icon="star" data-size="18"></i>
      <span class="tip gf-tooltip" data-i18n="header.rate_us">Rate us</span>
    </button>
    <button class="gf-icon-btn" id="guideBtn" type="button" aria-label="Guide">
      <i class="gf-icon" data-icon="guide" data-size="18"></i>
      <span class="tip gf-tooltip">Guide</span>
    </button>
    <button class="gf-icon-btn" id="historyBtn" type="button" aria-label="History">
      <i class="gf-icon" data-icon="history" data-size="18"></i>
      <span class="tip gf-tooltip">History</span>
    </button>
    <button class="gf-icon-btn" id="helpBtn" type="button" aria-label="Help">
      <i class="gf-icon" data-icon="help" data-size="18"></i>
      <span class="tip gf-tooltip" data-i18n="header.help_tip">Help</span>
    </button>
    <button class="gf-icon-btn" id="settingsBtn" type="button" aria-label="Settings">
      <i class="gf-icon" data-icon="settings" data-size="18"></i>
      <span class="tip gf-tooltip" data-i18n="header.settings_tip">Settings</span>
    </button>
  </div>
</header>

<main>
  <!-- Popup / Page can't be captured -->
  <section id="unsupportedPanel" aria-live="polite">
    <i class="gf-ill" data-ill="page-cant-be-captured" data-width="160"></i>
    <h2 class="gf-t-title" id="unsupportedTitle" style="margin:0">This page can't be captured</h2>
    <p class="gf-t-body" id="unsupportedDesc">Chrome doesn't allow GoFully to capture this page.</p>
    <button class="gf-btn gf-btn--secondary gf-btn--md" id="unsupportedDismissBtn" type="button" data-i18n="unsupported.dismiss">Got it</button>
  </section>

  <!-- Popup / Default -->
  <section id="modesSection">
    <button class="mode-btn primary gf-card gf-card--interactive" data-mode="full-page" type="button">
      <span class="gf-tile"><i class="gf-icon" data-icon="full-page" data-size="20"></i></span>
      <span class="m-text">
        <span class="m-name gf-t-heading" data-i18n="mode.full_page.name">Full page</span>
        <span class="m-desc gf-t-small" data-i18n="mode.full_page.desc">Top to bottom, one image</span>
      </span>
      <span class="m-kbd gf-keys" data-command="capture-full-page"></span>
    </button>
    <div class="more">
      <p class="gf-t-label" data-i18n="popup.more_ways">More ways to capture</p>
      <label class="delay" title="Full page and visible area wait this long. The popup closes so you can open a menu or hover a tooltip first.">
        <i class="gf-icon" data-icon="timer" data-size="14"></i>
        <span class="gf-t-small" data-i18n="popup.delay">Delay</span>
        <select class="gf-select delay-select" id="delaySelect" aria-label="Delay before full page and visible area captures">
          <option value="0">Off</option>
          <option value="3">3 s</option>
          <option value="5">5 s</option>
          <option value="10">10 s</option>
        </select>
      </label>
    </div>
    <button class="mode-btn gf-card gf-card--interactive" data-mode="visible-area" type="button">
      <span class="m-top"><span class="gf-tile gf-tile--32 gf-tile--blue"><i class="gf-icon" data-icon="visible" data-size="18"></i></span><span class="m-kbd gf-keys" data-command="capture-visible"></span></span>
      <span class="m-text"><span class="m-name gf-t-body-medium" data-i18n="mode.visible_area.name">Visible area</span><span class="m-desc gf-t-small" data-i18n="mode.visible_area.desc">What you see now</span></span>
    </button>
    <button class="mode-btn gf-card gf-card--interactive" data-mode="selected-area" type="button">
      <span class="m-top"><span class="gf-tile gf-tile--32 gf-tile--blue"><i class="gf-icon" data-icon="region" data-size="18"></i></span><span class="m-kbd gf-keys" data-command="capture-selected-area"></span></span>
      <span class="m-text"><span class="m-name gf-t-body-medium" data-i18n="mode.selected_area.name">Selected area</span><span class="m-desc gf-t-small" data-i18n="mode.selected_area.desc">Drag a box</span></span>
    </button>
    <button class="mode-btn gf-card gf-card--interactive" data-mode="scrolling-area" type="button">
      <span class="m-top"><span class="gf-tile gf-tile--32 gf-tile--blue"><i class="gf-icon" data-icon="scrolling" data-size="18"></i></span></span>
      <span class="m-text"><span class="m-name gf-t-body-medium" data-i18n="mode.scrolling_area.name">Scrolling area</span><span class="m-desc gf-t-small" data-i18n="mode.scrolling_area.desc">A panel that scrolls</span></span>
    </button>
    <button class="mode-btn gf-card gf-card--interactive" data-mode="capture-element" type="button">
      <span class="m-top"><span class="gf-tile gf-tile--32 gf-tile--blue"><i class="gf-icon" data-icon="element" data-size="18"></i></span></span>
      <span class="m-text"><span class="m-name gf-t-body-medium" data-i18n="mode.capture_element.name">Element</span><span class="m-desc gf-t-small" data-i18n="mode.capture_element.desc">Click any part</span></span>
    </button>
    <button class="mode-btn gf-card gf-card--interactive" data-mode="annotate-page" type="button">
      <span class="m-top"><span class="gf-tile gf-tile--32 gf-tile--green"><i class="gf-icon" data-icon="draw" data-size="18"></i></span><span class="m-kbd gf-keys" data-keys="Cmd+Shift+H"></span></span>
      <span class="m-text"><span class="m-name gf-t-body-medium" data-i18n="mode.annotate_page.name">Draw on page</span><span class="m-desc gf-t-small" data-i18n="mode.annotate_page.desc">Mark up the live site</span></span>
    </button>
    <button class="mode-btn gf-card gf-card--interactive" data-mode="capture-text" type="button">
      <span class="m-top"><span class="gf-tile gf-tile--32 gf-tile--lilac"><i class="gf-icon" data-icon="text-ocr" data-size="18"></i></span></span>
      <span class="m-text"><span class="m-name gf-t-body-medium" data-i18n="mode.capture_text.name">Capture text</span><span class="m-desc gf-t-small" data-i18n="mode.capture_text.desc">Copy words from pixels</span></span>
    </button>
    <button class="mode-btn gf-card gf-card--interactive" data-mode="redact-page" type="button">
      <span class="m-top"><span class="gf-tile gf-tile--32 gf-tile--green"><i class="gf-icon" data-icon="auto-redact" data-size="18"></i></span></span>
      <span class="m-text"><span class="m-name gf-t-body-medium" data-i18n="mode.redact_page.name">Redact page</span><span class="m-desc gf-t-small" data-i18n="mode.redact_page.desc">Hide private text first</span></span>
    </button>
    <button class="mode-btn gf-card gf-card--interactive" data-mode="measure-page" type="button">
      <span class="m-top"><span class="gf-tile gf-tile--32 gf-tile--lilac"><i class="gf-icon" data-icon="ruler" data-size="18"></i></span></span>
      <span class="m-text"><span class="m-name gf-t-body-medium" data-i18n="mode.measure_page.name">Measure</span><span class="m-desc gf-t-small" data-i18n="mode.measure_page.desc">Sizes, gaps and colors</span></span>
    </button>
  </section>

  <!-- Last capture -->
  <div id="statusLine" class="gf-card">
    <img class="status-thumb" id="statusThumb" src="" alt="">
    <span class="status-text gf-t-small" id="statusText"></span>
    <button class="gf-btn gf-btn--ghost status-view" id="statusViewBtn" type="button" data-i18n="status.view">View</button>
  </div>

  <!-- Popup / History, History · search, · empty, · no results -->
  <section id="historySection">
    <div class="hist-header">
      <button class="gf-icon-btn" id="historyBackBtn" type="button" aria-label="Back">
        <i class="gf-icon" data-icon="chevron-left" data-size="18"></i>
      </button>
      <span class="hist-title gf-t-heading">History</span>
      <button class="gf-btn gf-btn--ghost" id="historyClearBtn" type="button">Clear all</button>
    </div>
    <label class="gf-search">
      <i class="gf-icon" data-icon="search" data-size="16"></i>
      <input class="gf-input" id="historySearch" type="search" placeholder="Search text, titles and links" aria-label="Search history" autocomplete="off" spellcheck="false">
    </label>
    <div class="hist-count gf-t-small" id="historyCount" aria-live="polite"></div>
    <div class="hist-grid" id="historyGrid"></div>
  </section>

  <!-- Popup / Capturing -->
  <section id="progressSection" aria-live="polite">
    <div class="prog-top">
      <span class="gf-tile"><i class="gf-icon" data-icon="loader" data-size="18"></i></span>
      <div class="prog-text">
        <div class="gf-t-body-medium" id="progressLabel" data-i18n="progress.preparing">Getting the page ready</div>
        <div class="gf-t-small gf-muted" data-i18n="progress.please_wait">Keep this tab open.</div>
      </div>
    </div>
    <div class="gf-progress"><i id="progressFill"></i></div>
  </section>

  <!-- Popup / Capture complete -->
  <section id="resultBar">
    <div class="popup-preview" id="popupPreviewContainer" style="display:none;">
      <img id="popupPreviewImg" src="" alt="Capture preview">
      <div class="popup-preview-fade" id="popupPreviewFade" style="display:none;">
        <span class="gf-tag" data-i18n="result.preview_pill">Full Page View</span>
      </div>
    </div>
    <div class="res-status">
      <span class="gf-t-title" data-i18n="result.captured">Screenshot captured</span>
      <span class="gf-t-small" id="resultText"></span>
    </div>
    <button class="gf-btn gf-btn--primary gf-btn--md gf-btn--block" id="copyBtn" type="button">
      <i class="gf-icon" data-icon="copy" data-size="16"></i><span data-i18n="action.copy">Copy</span>
    </button>
    <div class="res-row">
      <button class="gf-btn gf-btn--secondary" id="savePngBtn" type="button"><span data-i18n="action.png">PNG</span></button>
      <button class="gf-btn gf-btn--secondary" id="saveJpgBtn" type="button"><span data-i18n="action.jpg">JPG</span></button>
      <button class="gf-btn gf-btn--secondary" id="saveWebpBtn" type="button"><span data-i18n="action.webp">WebP</span></button>
      <button class="gf-btn gf-btn--secondary" id="savePdfBtn" type="button"><span data-i18n="action.pdf">PDF</span></button>
      <button class="gf-btn gf-btn--secondary" id="editBtn" type="button"><span data-i18n="action.edit">Edit</span></button>
    </div>
  </section>

  <!-- Popup / Capture failed (inline notice) -->
  <div id="errorBar" class="gf-banner gf-banner--error" role="alert">
    <i class="gf-icon" data-icon="alert" data-size="18"></i>
    <span id="errorMsg"></span>
  </div>
</main>

<footer class="ftr gf-t-small">
  <span class="ftr-dot"></span>
  <span class="ftr-text" data-i18n="footer.offline">Runs on your device</span>
  <span class="gf-t-caption" id="ftrVersion">GoFully</span>
</footer>

<div class="toast gf-toast" id="toast" role="status"></div>
<script src="popup.ts" type="module"></script>
</body>
</html>
