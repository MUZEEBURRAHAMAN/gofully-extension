<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=340">
  <title>GoFully</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue:     #1667F2;
      --blue-h:   #1257D8;
      --blue-bg:  #EDF1FE;
      --blue-bd:  #BDD0FB;

      --text:     #101828;
      --text-2:   #344054;
      --text-3:   #667085;
      --text-4:   #98A2B3;

      --border:   #E3E8EF;
      --border-h: #C8D0D9;
      --surface:  #F7F8FA;
      --white:    #FFFFFF;

      --green:    #027A48;
      --green-bg: #ECFDF3;
      --green-bd: #A6F4C5;
      --green-dot:#16B364;

      --red:      #B42318;
      --red-bg:   #FEF3F2;
      --red-bd:   #FECDCA;
    }

    body {
      width: 340px;
      background: var(--white);
      color: var(--text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 12px;
      line-height: 1;
      overflow: hidden;
      user-select: none;
    }

    svg { display: block; flex-shrink: 0; }

    /* ─── HEADER ─── */
    .hdr {
      height: 44px;
      padding: 0 10px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .logo-img {
      width: 22px; height: 22px;
      flex-shrink: 0;
      display: block;
      object-fit: contain;
    }

    .wm {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1;
    }
    .wm-go   { color: var(--text-2); font-weight: 500; }
    .wm-full { color: var(--blue); font-weight: 700; }
    .wm-y    { color: var(--blue); opacity: 0.45; font-weight: 700; }

    .hdr-right { display: flex; gap: 1px; }

    .icon-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: transparent; cursor: pointer;
      color: var(--text-4);
      transition: color .1s, background .1s;
    }
    .icon-btn:hover { color: var(--text-2); background: var(--surface); }
    .icon-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

    /* ─── MODE LIST ─── */
    #modesSection { }

    .mode-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: left;
      border-left: 2px solid transparent;
      transition: background .08s;
    }
    .mode-btn:hover { background: var(--surface); }
    .mode-btn:hover .m-icon { color: var(--text-3); }
    .mode-btn:active { background: var(--border); }
    .mode-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

    /* Primary mode highlight */
    .mode-btn.primary {
      background: var(--blue-bg);
      border-left-color: var(--blue);
    }
    .mode-btn.primary:hover { background: #E3EAFD; }
    .mode-btn.primary .m-icon { color: var(--blue); }
    .mode-btn.primary .m-name { color: var(--blue); font-weight: 600; }

    .m-icon {
      width: 15px; height: 15px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--text-4);
    }
    .m-icon svg { width: 15px; height: 15px; }

    .m-text { flex: 1; min-width: 0; }

    .m-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      display: block;
    }

    .m-desc {
      font-size: 10px;
      color: var(--text-4);
      display: block;
      margin-top: 2.5px;
    }

    .m-kbd {
      font-size: 9px;
      font-weight: 500;
      color: var(--text-4);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 4px;
      flex-shrink: 0;
      font-family: inherit;
      letter-spacing: 0;
    }

    /* Divider between auto and manual groups */
    .m-sep {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    /* ─── PROGRESS ─── */
    #progressSection {
      display: none;
      padding: 18px 14px 18px;
    }
    #progressSection.active { display: block; }

    .prog-top {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 14px;
    }

    .prog-icon {
      width: 34px; height: 34px;
      flex-shrink: 0;
      background: var(--blue-bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--blue);
    }

    .prog-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
    }

    .prog-sub {
      font-size: 10.5px;
      color: var(--text-4);
      margin-top: 3px;
    }

    .prog-track {
      height: 2px;
      background: var(--border);
    }

    .prog-fill {
      height: 100%;
      background: var(--blue);
      width: 0%;
      transition: width .3s ease;
    }

    /* ─── RESULT ─── */
    #resultBar { display: none; }
    #resultBar.active { display: block; }

    .res-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: var(--green-bg);
      border-bottom: 1px solid var(--green-bd);
    }

    .res-check { color: var(--green); flex-shrink: 0; }

    .res-title {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--green);
      flex: 1;
    }

    .res-dim {
      font-size: 10px;
      font-weight: 500;
      color: #059669;
      font-variant-numeric: tabular-nums;
    }

    /* Collapsed button group — VS Code toolbar style */
    .res-actions {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .res-btn {
      flex: 1;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: none;
      border-right: 1px solid var(--border);
      background: var(--white);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-2);
      font-family: inherit;
      transition: background .08s, color .08s;
    }
    .res-btn:last-child { border-right: none; }
    .res-btn:hover { background: var(--surface); color: var(--text); }
    .res-btn:active { background: var(--border); }
    .res-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

    .res-btn.prim {
      flex: 1.8;
      background: var(--blue);
      border-right-color: var(--blue-h);
      color: #fff;
      font-weight: 600;
    }
    .res-btn.prim:hover { background: var(--blue-h); }
    .res-btn.prim:active { background: #0F44C0; }

    /* ─── ERROR ─── */
    #errorBar { display: none; }
    #errorBar.active {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 12px;
      background: var(--red-bg);
      border-top: 1px solid var(--red-bd);
    }

    .err-icon { color: var(--red); flex-shrink: 0; margin-top: 1px; }
    .err-text  { font-size: 11px; color: #991B1B; line-height: 1.45; }

    /* ─── FOOTER ─── */
    .ftr {
      height: 28px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .ftr-left  { display: flex; align-items: center; gap: 5px; }
    .ftr-dot   { width: 5px; height: 5px; background: var(--green-dot); border-radius: 50%; }
    .ftr-text  { font-size: 10px; font-weight: 500; color: var(--text-4); }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 34px; left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: var(--text);
      color: #fff;
      padding: 5px 11px;
      font-size: 11px; font-weight: 600;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      opacity: 0; pointer-events: none;
      transition: opacity .18s, transform .18s;
      white-space: nowrap; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="brand">
    <img class="logo-img" src="assets/icon-128.png" alt="">
    <span class="wm">
      <span class="wm-go">Go</span><span class="wm-full">Full</span><span class="wm-y">y</span>
    </span>
  </div>
  <div class="hdr-right">
    <button class="icon-btn" id="settingsBtn" title="Settings">
      <!-- Hugeicons: setting-02 -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</div>

<!-- MODE LIST -->
<div id="modesSection">

  <button class="mode-btn primary" data-mode="full-page">
    <div class="m-icon">
      <!-- Hugeicons: browser -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16"/>
        <path d="M2 9H22"/>
        <circle cx="5.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/>
        <circle cx="8.2" cy="6.5" r=".9" fill="currentColor" stroke="none"/>
        <circle cx="10.9" cy="6.5" r=".9" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="m-text">
      <span class="m-name">Full Page</span>
      <span class="m-desc">Entire scrollable document</span>
    </div>
    <span class="m-kbd">⌥⇧F</span>
  </button>

  <button class="mode-btn" data-mode="visible-area">
    <div class="m-icon">
      <!-- Hugeicons: computer -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14"/>
        <path d="M8 21H16M12 17V21"/>
      </svg>
    </div>
    <div class="m-text">
      <span class="m-name">Visible Area</span>
      <span class="m-desc">Current viewport only</span>
    </div>
    <span class="m-kbd">⌥⇧V</span>
  </button>

  <div class="m-sep"></div>

  <button class="mode-btn" data-mode="selected-area">
    <div class="m-icon">
      <!-- Hugeicons: crop-01 -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2V18H22"/>
        <path d="M2 6H18V22"/>
      </svg>
    </div>
    <div class="m-text">
      <span class="m-name">Selected Area</span>
      <span class="m-desc">Drag to select region</span>
    </div>
  </button>

  <button class="mode-btn" data-mode="scrolling-area">
    <div class="m-icon">
      <!-- Hugeicons: swipe-down / scroll arrows -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3V21"/>
        <path d="M8 7L12 3L16 7"/>
        <path d="M8 17L12 21L16 17"/>
      </svg>
    </div>
    <div class="m-text">
      <span class="m-name">Scrolling Area</span>
      <span class="m-desc">Select region + auto-scroll</span>
    </div>
  </button>

  <button class="mode-btn" data-mode="scrollable-element">
    <div class="m-icon">
      <!-- Hugeicons: layers / element container with scrollbar -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="16" height="16"/>
        <path d="M20 8V16"/>
        <path d="M18 10L20 8L22 10"/>
        <path d="M18 14L20 16L22 14"/>
      </svg>
    </div>
    <div class="m-text">
      <span class="m-name">Scrollable Element</span>
      <span class="m-desc">Capture any overflow container</span>
    </div>
  </button>

</div>

<!-- PROGRESS -->
<div id="progressSection">
  <div class="prog-top">
    <div class="prog-icon">
      <!-- Hugeicons: clock-01 -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6V12L16 14"/>
      </svg>
    </div>
    <div>
      <div class="prog-label" id="progressLabel">Preparing capture…</div>
      <div class="prog-sub">Please wait</div>
    </div>
  </div>
  <div class="prog-track">
    <div class="prog-fill" id="progressFill"></div>
  </div>
</div>

<!-- RESULT -->
<div id="resultBar">
  <div class="res-status">
    <div class="res-check">
      <!-- Hugeicons: tick-02 -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17L4 12"/>
      </svg>
    </div>
    <span class="res-title">Screenshot captured</span>
    <span class="res-dim" id="resultText"></span>
  </div>
  <div class="res-actions">
    <button class="res-btn prim" id="copyBtn">
      <!-- Hugeicons: copy-01 -->
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      Copy
    </button>
    <button class="res-btn" id="savePngBtn">
      <!-- Hugeicons: image-01 -->
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15L16 10L5 21"/>
      </svg>
      PNG
    </button>
    <button class="res-btn" id="savePdfBtn">
      <!-- Hugeicons: file-pdf -->
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
        <path d="M14 2V8H20"/>
        <path d="M9 13H15M9 17H12"/>
      </svg>
      PDF
    </button>
    <button class="res-btn" id="editBtn">
      <!-- Hugeicons: pencil-edit-01 -->
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
      </svg>
      Edit
    </button>
  </div>
</div>

<!-- ERROR -->
<div id="errorBar">
  <svg class="err-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 8V12"/>
    <path d="M12 16H12.01"/>
  </svg>
  <span class="err-text" id="errorMsg"></span>
</div>

<!-- FOOTER -->
<div class="ftr">
  <div class="ftr-left">
    <div class="ftr-dot"></div>
    <span class="ftr-text">GoFully v1.0</span>
  </div>
  <span class="ftr-text">100% Offline</span>
</div>

<div class="toast" id="toast"></div>
<script src="popup.ts" type="module"></script>
</body>
</html>
