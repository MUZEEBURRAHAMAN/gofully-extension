<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=340">
  <title>GoFully</title>
  <style>
    @font-face {
      font-family: 'Archivo';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('assets/Archivo.woff2') format('woff2');
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue:     #1667F2;
      --blue-h:   #1257D8;
      --blue-a:   #0E4AB8;
      --blue-bg:  #EDF1FE;
      --blue-bd:  #BDD0FB;
      --blue-lt:  #D4E2FD;

      --text:     #101828;
      --text-2:   #344054;
      --text-3:   #667085;
      --text-4:   #98A2B3;

      --border:   #E3E8EF;
      --border-h: #C8D0D9;
      --surface:  #F7F8FA;
      --sunken:   #F1F3F7;
      --white:    #FFFFFF;
      --card:     #FFFFFF;

      --green:    #027A48;
      --green-bg: #ECFDF3;
      --green-bd: #A6F4C5;
      --green-dot:#16B364;

      --red:      #B42318;
      --red-bg:   #FEF3F2;
      --red-bd:   #FECDCA;

      --r-sm:     0px;
      --r-md:     0px;
      --r-lg:     0px;
      --r-xl:     0px;
      --r-pill:   0px;

      --shadow-sm: 0 1px 3px rgba(22,103,242,0.04), 0 4px 8px rgba(22,103,242,0.06);
      --shadow-md: 0 4px 6px -2px rgba(22,103,242,0.04), 0 12px 16px -4px rgba(22,103,242,0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --blue:      #4C8DFF;
        --blue-h:    #6BA0FF;
        --blue-a:    #82B2FF;
        --blue-bg:   rgba(76,141,255,.14);
        --blue-bd:   rgba(76,141,255,.4);
        --blue-lt:   rgba(76,141,255,.22);
        --text:      #F0F2F5;
        --text-2:    #C5CAD3;
        --text-3:    #9AA1AF;
        --text-4:    #7D8590;
        --border:    #33383F;
        --border-h:  #454B54;
        --surface:   #1B1D21;
        --sunken:    #222428;
        --card:      #232529;
        --green:     #2FBE79;
        --green-bg:  rgba(47,190,121,.14);
        --green-bd:  rgba(47,190,121,.4);
        --green-dot: #2FBE79;
      }
    }
    :root[data-theme="dark"] {
      --blue:      #4C8DFF;
      --blue-h:    #6BA0FF;
      --blue-a:    #82B2FF;
      --blue-bg:   rgba(76,141,255,.14);
      --blue-bd:   rgba(76,141,255,.4);
      --blue-lt:   rgba(76,141,255,.22);
      --text:      #F0F2F5;
      --text-2:    #C5CAD3;
      --text-3:    #9AA1AF;
      --text-4:    #7D8590;
      --border:    #33383F;
      --border-h:  #454B54;
      --surface:   #1B1D21;
      --sunken:    #222428;
      --card:      #232529;
      --green:     #2FBE79;
      --green-bg:  rgba(47,190,121,.14);
      --green-bd:  rgba(47,190,121,.4);
      --green-dot: #2FBE79;
    }

    body {
      width: 340px;
      background: var(--card);
      color: var(--text);
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 12.5px;
      line-height: 1.4;
      overflow: hidden;
      user-select: none;
    }

    svg { display: block; flex-shrink: 0; }

    /* ─── HEADER ─── */
    .hdr {
      height: 48px;
      padding: 0 12px 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-img {
      width: 24px; height: 24px;
      flex-shrink: 0;
      display: block;
      object-fit: contain;
    }

    .wm {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1;
    }
    .wm-go   { color: var(--text-2); font-weight: 500; }
    .wm-full { color: var(--blue); font-weight: 700; }
    .wm-y    { color: var(--blue); opacity: 0.45; font-weight: 700; }

    .hdr-right { display: flex; gap: 2px; }

    .icon-btn {
      position: relative;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: transparent; cursor: pointer;
      color: var(--text-3);
      border-radius: var(--r-sm);
      transition: color .12s, background .12s;
    }
    .icon-btn:hover { color: var(--text-2); background: var(--surface); }
    .icon-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

    /* Tooltip — same dark styled tooltip used in the editor toolbar, so
       hover labels look consistent across the whole app instead of the
       browser's native title tooltip. */
    .icon-btn .tip {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #1d1f20;
      border: 1px solid rgba(255,255,255,0.1);
      color: #f2f2f3;
      font-size: 10.5px;
      font-weight: 500;
      padding: 3px 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s;
      z-index: 100;
    }
    .icon-btn:hover .tip { opacity: 1; }

    /* ─── BLUEPRINT FRAME (Industry design system) ───
       Hairline border + four "+" registration marks at the corners, used
       instead of filled/rounded surfaces. */
    .bp { position: relative; border: 1px solid var(--border); }
    .bp > .cm { position: absolute; width: 8px; height: 8px; color: var(--blue-bd); }
    .bp > .cm::before { content: ""; position: absolute; left: 3px; top: 0; width: 1px; height: 100%; background: currentColor; }
    .bp > .cm::after  { content: ""; position: absolute; top: 3px; left: 0; width: 100%; height: 1px; background: currentColor; }
    .bp > .cm.tl { top: -4px; left: -4px; }
    .bp > .cm.tr { top: -4px; right: -4px; }
    .bp > .cm.bl { bottom: -4px; left: -4px; }
    .bp > .cm.br { bottom: -4px; right: -4px; }

    /* ─── UNSUPPORTED PAGE NOTICE PANEL ─── */
    #unsupportedPanel {
      display: none;
      margin: 12px 16px 0;
      padding: 14px;
      background: rgba(234,179,8,.06);
      border: 1px solid rgba(234,179,8,.25);
      animation: fadeIn 0.16s ease-out;
    }
    #unsupportedPanel.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .unsupp-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .unsupp-icon {
      color: #ca8a04;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .unsupp-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #92400e;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #unsupportedPanel {
        background: rgba(234,179,8,.1);
        border-color: rgba(234,179,8,.3);
      }
      :root:not([data-theme="light"]) .unsupp-icon { color: #f2c14e; }
      :root:not([data-theme="light"]) .unsupp-title { color: #f2c14e; }
    }
    :root[data-theme="dark"] #unsupportedPanel {
      background: rgba(234,179,8,.1);
      border-color: rgba(234,179,8,.3);
    }
    :root[data-theme="dark"] .unsupp-icon,
    :root[data-theme="dark"] .unsupp-title { color: #f2c14e; }

    .unsupp-desc {
      font-family: 'Barlow', sans-serif;
      font-size: 11px;
      color: var(--text-3);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .unsupp-actions {
      display: flex;
      justify-content: flex-end;
    }

    .unsupp-btn {
      height: 28px;
      padding: 0 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, border-color 0.12s;
    }
    .unsupp-btn:hover { background: var(--surface); border-color: var(--border-h); }
    .unsupp-btn:active { transform: scale(0.97); }
    .unsupp-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

    /* ─── MODE GRID ─── */
    #modesSection {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mode-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      min-height: 92px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      background: var(--card);
      cursor: pointer;
      text-align: left;
      transition: background .1s, border-color .1s, transform .06s, box-shadow .14s;
    }
    .mode-btn:hover {
      background: var(--surface);
      border-color: var(--border-h);
      box-shadow: var(--shadow-sm);
    }
    .mode-btn:active { transform: scale(0.98); }
    .mode-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

    /* Full Page — primary CTA spanning both columns */
    .mode-btn.primary {
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: center;
      height: 56px;
      background: var(--blue);
      border-color: var(--blue);
      border-radius: var(--r-xl);
      color: var(--white);
      box-shadow: var(--shadow-sm);
    }
    .mode-btn.primary:hover {
      background: var(--blue-h); border-color: var(--blue-h);
      transform: none;
      box-shadow: var(--shadow-sm);
    }
    .mode-btn.primary:active {
      background: var(--blue-a); border-color: var(--blue-a);
      transform: none;
    }
    .mode-btn.primary .m-icon,
    .mode-btn.primary:hover .m-icon,
    .mode-btn.primary:focus .m-icon,
    .mode-btn.primary:focus-visible .m-icon,
    .mode-btn.primary:active .m-icon {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.18) !important;
      border-radius: var(--r-sm);
      color: var(--white) !important;
    }
    .mode-btn.primary .m-icon svg { width: 17px; height: 17px; }
    .mode-btn.primary .m-text { flex: 1; }
    .mode-btn.primary .m-name { color: var(--white); font-weight: 700; font-size: 14px; }
    .mode-btn.primary .m-desc { color: rgba(255,255,255,0.72); font-size: 10.5px; }
    .mode-btn.primary .m-kbd {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.85);
      /* Base .m-kbd sets margin-top:auto for the column-layout mode buttons
         (pins the badge to the bottom); the primary button is a row layout,
         where that same rule pushes the badge to the bottom of the CROSS
         axis instead, fighting align-items:center and landing it wedged in
         the bottom-right corner. Reset it here so it centers normally. */
      margin-top: 0;
      margin-left: 8px;
      flex-shrink: 0;
    }

    /* Disabled mode button on unsupported pages */
    .mode-btn:disabled {
      cursor: not-allowed;
      pointer-events: none;
      background: var(--surface) !important;
      border-color: var(--border) !important;
      box-shadow: none !important;
    }
    .mode-btn:disabled .m-icon { color: var(--text-3) !important; background: var(--sunken) !important; }
    .mode-btn:disabled .m-name { color: var(--text-3) !important; }
    .mode-btn:disabled .m-desc { color: var(--text-3) !important; }
    .mode-btn:disabled .m-kbd { color: var(--text-3) !important; border-color: var(--border) !important; background: var(--sunken) !important; }

    .m-icon {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: var(--surface);
      border-radius: var(--r-sm);
      color: var(--text-3);
      transition: color .1s, background .1s;
    }
    .m-icon svg { width: 15px; height: 15px; }
    .mode-btn:hover:not(.primary) .m-icon { color: var(--blue); background: var(--blue-bg); }

    .m-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

    .m-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .m-desc {
      font-size: 10px;
      color: var(--text-3);
      display: block;
      line-height: 1.3;
    }

    .m-kbd {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--text-2);
      background: var(--sunken);
      border: 1px solid var(--border-h);
      padding: 2px 5px;
      border-radius: 2px;
      font-family: inherit;
      letter-spacing: 0.01em;
      margin-top: auto;
      white-space: nowrap;
    }

    /* ─── STATUS LINE ─── */
    #statusLine {
      display: none;
      align-items: center;
      gap: 8px;
      margin: 0 14px 12px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
    }
    #statusLine.active { display: flex; }
    .status-thumb {
      width: 28px; height: 28px;
      border-radius: var(--r-sm);
      object-fit: cover;
      object-position: top center;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--card);
    }
    .status-text {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-text b { color: var(--text-2); font-weight: 600; }
    .status-view {
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      cursor: pointer;
      flex-shrink: 0;
      background: none;
      border: none;
      font-family: inherit;
      padding: 2px 4px;
      border-radius: 0;
      transition: background .12s;
    }
    .status-view:hover { background: var(--blue-bg); }

    /* ─── PROGRESS ─── */
    #progressSection {
      display: none;
      padding: 20px 16px 20px;
    }
    #progressSection.active { display: block; }

    .prog-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .prog-icon {
      width: 36px; height: 36px;
      flex-shrink: 0;
      background: var(--blue-bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--blue);
    }
    .prog-icon > .cm { color: var(--blue-bd); }

    .prog-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .prog-sub {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 3px;
    }

    .prog-track {
      height: 4px;
      border-radius: var(--r-pill);
      background: var(--sunken);
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      width: 100%;
      background: var(--blue);
      border-radius: var(--r-pill);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }

    /* ─── RESULT ─── */
    #resultBar { display: none; }
    #resultBar.active { display: block; }

    .res-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(22,103,242,.08);
      border-bottom: 1px solid rgba(22,103,242,.12);
    }

    .res-check { color: var(--blue); flex-shrink: 0; }

    .res-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--blue-h);
      flex: 1;
    }

    .res-dim {
      font-size: 10.5px;
      font-weight: 500;
      color: rgba(22,103,242,.7);
      font-variant-numeric: tabular-nums;
    }

    .res-actions {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .res-btn {
      flex: 1;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: none;
      border-right: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text-2);
      font-family: 'Barlow Condensed', sans-serif;
      transition: background .08s, color .08s;
    }
    .res-btn:last-child { border-right: none; }
    .res-btn:hover { background: var(--surface); color: var(--text); }
    .res-btn:active { background: var(--sunken); }
    .res-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

    .res-btn.prim {
      flex: 1.6;
      background: var(--blue);
      border-right-color: var(--blue-h);
      color: #f2f2f3;
      font-weight: 600;
    }
    .res-btn.prim:hover { background: var(--blue-h); }

    .popup-preview {
      position: relative;
      width: 100%;
      height: 150px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .popup-preview img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      object-position: top center;
    }
    .popup-preview-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 48px;
      background: linear-gradient(to bottom, rgba(241, 243, 247, 0) 0%, rgba(241, 243, 247, 0.92) 80%, rgba(241, 243, 247, 1) 100%);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      pointer-events: none;
    }
    .popup-preview-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-3);
      background: rgba(242,242,243,.9);
      border: 1px solid var(--border);
      padding: 2px 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ─── ERROR ─── */
    #errorBar { display: none; }
    #errorBar.active {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 14px;
      background: var(--red-bg);
      border-top: 1px solid var(--red-bd);
    }

    .err-icon { color: var(--red); flex-shrink: 0; margin-top: 1px; }
    .err-text  { font-size: 11px; color: #991B1B; line-height: 1.45; }

    /* ─── FOOTER ─── */
    .ftr {
      height: 30px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .ftr-left  { display: flex; align-items: center; gap: 5px; }
    .ftr-dot   { width: 5px; height: 5px; background: var(--green-dot); border-radius: 50%; }
    .ftr-text  { font-size: 10px; font-weight: 500; color: var(--text-3); }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 36px; left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: #1d1f20;
      color: #f2f2f3;
      padding: 6px 14px;
      font-size: 11px; font-weight: 600;
      border-radius: var(--r-pill);
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      opacity: 0; pointer-events: none;
      transition: opacity .18s, transform .18s;
      white-space: nowrap; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── REDUCED MOTION ─── */
    /* Keep color/background/opacity feedback (it carries state), drop only
       the spatial motion for users with vestibular sensitivity. */
    @media (prefers-reduced-motion: reduce) {
      .mode-btn.primary:hover,
      .mode-btn:active,
      .unsupp-btn:active {
        transform: none;
      }
      .toast {
        transition: opacity .18s;
      }
      .toast.show { transform: translateX(-50%); }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="brand">
    <img class="logo-img" src="assets/icon-128.png" alt="">
    <span class="wm">
      <span class="wm-go">Go</span><span class="wm-full">Full</span><span class="wm-y">y</span>
    </span>
  </div>
  <div class="hdr-right">
    <button class="icon-btn" id="helpBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <span class="tip" data-i18n="header.help_tip">How Features Work (Help Guide)</span>
    </button>
    <button class="icon-btn" id="settingsBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span class="tip" data-i18n="header.settings_tip">Settings</span>
    </button>
  </div>
</div>

<!-- UNSUPPORTED NOTICE PANEL -->
<div id="unsupportedPanel">
  <div class="unsupp-header">
    <div class="unsupp-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <span class="unsupp-title" id="unsupportedTitle">Capture isn't available here</span>
  </div>
  <div class="unsupp-desc" id="unsupportedDesc">
    GoFully can't capture browser or restricted pages. Open a regular webpage and try again.
  </div>
  <div class="unsupp-actions">
    <button class="unsupp-btn" id="unsupportedDismissBtn" type="button" data-i18n="unsupported.dismiss">Got it</button>
  </div>
</div>

<!-- MODE GRID -->
<div id="modesSection">

  <button class="mode-btn primary" data-mode="full-page">
    <div class="m-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="M2 9h20"/>
        <circle cx="5.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/>
        <circle cx="8.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/>
        <circle cx="11.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="m-text">
      <span class="m-name" data-i18n="mode.full_page.name">Full Page</span>
      <span class="m-desc" data-i18n="mode.full_page.desc">Entire scrollable document</span>
    </div>
    <span class="m-kbd" data-command="capture-full-page">Cmd+Shift+F</span>
  </button>

  <button class="mode-btn" data-mode="visible-area">
    <div class="m-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
    </div>
    <div class="m-text">
      <span class="m-name" data-i18n="mode.visible_area.name">Visible Area</span>
      <span class="m-desc" data-i18n="mode.visible_area.desc">Current viewport</span>
    </div>
    <span class="m-kbd" data-command="capture-visible">Cmd+Shift+V</span>
  </button>

  <button class="mode-btn" data-mode="selected-area">
    <div class="m-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2v16h16"/>
        <path d="M2 6h16v16"/>
      </svg>
    </div>
    <div class="m-text">
      <span class="m-name" data-i18n="mode.selected_area.name">Selected Area</span>
      <span class="m-desc" data-i18n="mode.selected_area.desc">Drag to select region</span>
    </div>
    <span class="m-kbd" data-command="capture-selected-area">Cmd+Shift+A</span>
  </button>

  <button class="mode-btn" data-mode="scrolling-area">
    <div class="m-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18"/>
        <path d="M8 7l4-4 4 4"/>
        <path d="M8 17l4 4 4-4"/>
      </svg>
    </div>
    <div class="m-text">
      <span class="m-name" data-i18n="mode.scrolling_area.name">Scrolling Area</span>
      <span class="m-desc" data-i18n="mode.scrolling_area.desc">Select + auto-scroll</span>
    </div>
  </button>

  <button class="mode-btn" data-mode="capture-text">
    <div class="m-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7V4h16v3"/>
        <path d="M9 20h6"/>
        <path d="M12 4v16"/>
        <path d="M3 12h3"/>
        <path d="M18 12h3"/>
      </svg>
    </div>
    <div class="m-text">
      <span class="m-name" data-i18n="mode.capture_text.name">Capture Text</span>
      <span class="m-desc" data-i18n="mode.capture_text.desc">Extract & copy (OCR)</span>
    </div>
  </button>

</div>

<!-- STATUS LINE (last capture) -->
<div id="statusLine">
  <img class="status-thumb" id="statusThumb" src="" alt="">
  <span class="status-text" id="statusText"></span>
  <button class="status-view" id="statusViewBtn" type="button" data-i18n="status.view">View</button>
</div>

<!-- PROGRESS -->
<div id="progressSection">
  <div class="prog-top">
    <div class="prog-icon bp"><i class="cm tl"></i><i class="cm tr"></i><i class="cm bl"></i><i class="cm br"></i>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
    </div>
    <div>
      <div class="prog-label" id="progressLabel" data-i18n="progress.preparing">Preparing capture...</div>
      <div class="prog-sub" data-i18n="progress.please_wait">Please wait</div>
    </div>
  </div>
  <div class="prog-track">
    <div class="prog-fill" id="progressFill"></div>
  </div>
</div>

<!-- RESULT -->
<div id="resultBar">
  <div class="res-status">
    <div class="res-check">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <span class="res-title" data-i18n="result.captured">Screenshot captured</span>
    <span class="res-dim" id="resultText"></span>
  </div>
  <div class="popup-preview" id="popupPreviewContainer" style="display:none;">
    <img id="popupPreviewImg" src="" alt="Capture Preview" />
    <div class="popup-preview-fade" id="popupPreviewFade" style="display:none;">
      <span class="popup-preview-pill" data-i18n="result.preview_pill">Full Page View</span>
    </div>
  </div>
  <div class="res-actions">
    <button class="res-btn prim" id="copyBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="1"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      <span data-i18n="action.copy">Copy</span>
    </button>
    <button class="res-btn" id="savePngBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span data-i18n="action.png">PNG</span>
    </button>
    <button class="res-btn" id="saveWebpBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span data-i18n="action.webp">WebP</span>
    </button>
    <button class="res-btn" id="savePdfBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <path d="M9 13h6M9 17h3"/>
      </svg>
      <span data-i18n="action.pdf">PDF</span>
    </button>
    <button class="res-btn" id="editBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
      </svg>
      <span data-i18n="action.edit">Edit</span>
    </button>
  </div>
</div>

<!-- ERROR -->
<div id="errorBar">
  <svg class="err-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 8V12"/>
    <path d="M12 16H12.01"/>
  </svg>
  <span class="err-text" id="errorMsg"></span>
</div>

<!-- FOOTER -->
<div class="ftr">
  <div class="ftr-left">
    <div class="ftr-dot"></div>
    <span class="ftr-text">GoFully v1.1</span>
  </div>
  <span class="ftr-text" data-i18n="footer.offline">100% Offline</span>
</div>

<div class="toast" id="toast"></div>
<script src="popup.ts" type="module"></script>
</body>
</html>
