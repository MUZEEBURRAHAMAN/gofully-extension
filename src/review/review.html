<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoFully Review</title>
  <!-- Design: Figma "Extension UI v2" › Review / * (see .claude/skills/gofully-ui/references/screens.md) -->
  <script src="ds/chrome-stub.js"></script>
  <link rel="stylesheet" href="ds/tokens.css">
  <link rel="stylesheet" href="ds/components.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .topbar { flex: none; display: flex; align-items: center; gap: var(--gf-s-3); padding: 12px var(--gf-s-6); background: var(--gf-bg-surface); border-bottom: 1px solid var(--gf-border); }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .topbar-left img { width: 28px; height: 28px; border-radius: var(--gf-r-sm); }
    .crumb { color: var(--gf-text-placeholder); }
    .method-label { color: var(--gf-text-3); font-size: 12px; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--gf-s-2); }
    .zoom { display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--gf-border); border-radius: var(--gf-r-md); }
    .zoom .gf-icon-btn { width: 28px; height: 28px; }
    #zoomPct { min-width: 48px; text-align: center; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .export-drop-wrap { position: relative; }
    .export-drop-menu { position: fixed; z-index: 50; display: none; width: 280px; flex-direction: column; gap: 2px; padding: 6px; background: var(--gf-bg-surface); border: 1px solid var(--gf-border); border-radius: var(--gf-r-lg); box-shadow: var(--gf-shadow-lg); }
    .export-drop-menu.show { display: flex; }
    .export-settings { display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 10px; }
    .export-row { display: flex; align-items: center; justify-content: space-between; gap: var(--gf-s-2); }
    .export-row-label { font-size: 13px; }
    .export-settings .gf-input, .export-settings .gf-select { min-height: 32px; font-size: 13px; }
    .export-row .gf-select { width: auto; }
    .export-drop-sep { height: 1px; margin: 4px 0; background: var(--gf-border); }
    .export-drop-label { padding: 6px var(--gf-s-2) 2px; color: var(--gf-text-3); font-size: 12px; font-weight: 500; }
    .export-drop-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px var(--gf-s-2); border: 0; border-radius: var(--gf-r-md); background: transparent; color: var(--gf-text); font-size: 14px; line-height: 20px; text-align: left; }
    .export-drop-item:hover { background: var(--gf-bg-hover); }
    .export-drop-item .gf-icon { color: var(--gf-text-2); }
    .preview-area { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: var(--gf-s-8) var(--gf-s-8) var(--gf-s-12); background: var(--gf-bg-sunken); }
    #previewImg { display: block; max-width: none; border: 1px solid var(--gf-border); border-radius: var(--gf-r-md); background: var(--gf-bg-surface); box-shadow: var(--gf-shadow-lg); }
    .empty-state { display: none; margin: auto; text-align: center; color: var(--gf-text-2); }
    .empty-state .gf-t-title { color: var(--gf-text); margin: var(--gf-s-2) 0 4px; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translateX(-50%) translateY(8px); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    @media (max-width: 720px) { .topbar { flex-wrap: wrap; padding: 10px var(--gf-s-4); } .method-label, .crumb, .zoom { display: none; } .preview-area { padding: var(--gf-s-4); } }
  </style>
</head>
<body class="gf">
  <header class="topbar">
    <div class="topbar-left">
      <img src="assets/gofully-symbol.png" alt="">
      <span class="gf-t-heading">GoFully</span>
      <span class="crumb">/</span>
      <span class="gf-t-body-medium gf-muted">Review</span>
      <span class="gf-tag" id="dimPill">— × —</span>
      <span class="method-label" id="methodLabel"></span>
    </div>
    <div class="topbar-right">
      <div class="zoom">
        <button class="gf-icon-btn" id="zoom-out-btn" type="button" title="Zoom out" aria-label="Zoom out"><i class="gf-icon" data-icon="zoom-out" data-size="16"></i></button>
        <span id="zoomPct">100%</span>
        <button class="gf-icon-btn" id="zoom-in-btn" type="button" title="Zoom in" aria-label="Zoom in"><i class="gf-icon" data-icon="zoom-in" data-size="16"></i></button>
      </div>
      <button class="gf-btn gf-btn--secondary" id="copy-btn" type="button"><i class="gf-icon" data-icon="copy" data-size="16"></i><span>Copy</span></button>
      <button class="gf-btn gf-btn--secondary" id="edit-btn" type="button"><i class="gf-icon" data-icon="edit" data-size="16"></i>Edit</button>
      <div class="export-drop-wrap">
        <button class="gf-btn gf-btn--primary" id="export-menu-btn" type="button"><i class="gf-icon" data-icon="download" data-size="16"></i>Save<i class="gf-icon" data-icon="chevron-down" data-size="14"></i></button>
        <div class="export-drop-menu" id="export-drop-menu">
          <div class="export-settings">
            <label class="gf-label" for="review-filename" style="margin:0">Filename</label>
            <input class="gf-input" type="text" id="review-filename" placeholder="Created from the page title" autocomplete="off" spellcheck="false">
            <div class="export-row">
              <span class="export-row-label">JPG and WebP quality</span>
              <select class="gf-select" id="review-image-quality" title="Compression quality for JPG and WebP exports">
                <option value="50">Low</option>
                <option value="75">Medium</option>
                <option value="92" selected>High</option>
                <option value="100">Maximum</option>
              </select>
            </div>
          </div>
          <div class="export-drop-sep"></div>
          <div class="export-drop-label">Save as</div>
          <button class="export-drop-item" id="save-png-btn" type="button"><i class="gf-icon" data-icon="image" data-size="16"></i>PNG</button>
          <button class="export-drop-item" id="save-jpg-btn" type="button"><i class="gf-icon" data-icon="image" data-size="16"></i>JPG</button>
          <button class="export-drop-item" id="save-webp-btn" type="button"><i class="gf-icon" data-icon="image" data-size="16"></i>WebP</button>
          <button class="export-drop-item" id="save-pdf-btn" type="button"><i class="gf-icon" data-icon="pdf" data-size="16"></i>PDF</button>
        </div>
      </div>
      <button class="gf-icon-btn" id="close-btn" type="button" title="Close" aria-label="Close"><i class="gf-icon" data-icon="close" data-size="18"></i></button>
    </div>
  </header>

  <main class="preview-area" id="previewArea">
    <img id="previewImg" alt="Your capture" style="display:none">
    <div class="empty-state" id="emptyState">
      <i class="gf-ill" data-ill="history-empty" data-width="180"></i>
      <div class="gf-t-title">No capture to review</div>
      <div class="gf-t-body">Take a capture from the popup and it opens here.</div>
    </div>
  </main>

  <div class="toast gf-toast" id="toast" role="status"></div>

  <script type="module" src="review.ts"></script>
</body>
</html>
