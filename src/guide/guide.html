<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoFully Guide</title>
  <style>
    @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('assets/Archivo.woff2') format('woff2'); }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
    :root {
      --ink: 29,31,32;
      --bg: #f2f2f3; --card: #ffffff; --blue: #1667F2; --blue-h: #1257D8; --blue-bg: #EDF1FE; --blue-bd: #BDD0FB;
      --text: #1d1f20; --text-2: rgba(var(--ink),.62); --text-3: rgba(var(--ink),.42); --border: rgba(var(--ink),.14); --hover: rgba(var(--ink),.06);
      --red: #B42318; --green: #027A48;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --ink: 255,255,255; --bg: #18181a; --card: #232326; --blue: #4C8DFF; --blue-h: #6BA0FF; --blue-bg: rgba(76,141,255,.14); --blue-bd: rgba(76,141,255,.4); --text: #F2F2F3; --red: #F97066; --green: #2FBE79; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --ink: 255,255,255; --bg: #18181a; --card: #232326; --blue: #4C8DFF; --blue-h: #6BA0FF; --blue-bg: rgba(76,141,255,.14); --blue-bd: rgba(76,141,255,.4); --text: #F2F2F3; --red: #F97066; --green: #2FBE79; color-scheme: dark; }
    body { font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); }
    .top-in { max-width: 920px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand { font-weight: 800; font-size: 15px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
    .brand i { width: 18px; height: 18px; background: var(--blue); display: inline-block; }
    #title { flex: 1; min-width: 220px; height: 36px; padding: 0 10px; font: 600 15px 'Archivo', sans-serif; color: var(--text); background: var(--card); border: 1px solid var(--border); outline: none; }
    #title:focus { border-color: var(--blue); }
    .btn { height: 36px; padding: 0 14px; font: 600 13px 'Archivo', sans-serif; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; transition: background .12s, border-color .12s; }
    .btn:hover:not(:disabled) { background: var(--hover); border-color: rgba(var(--ink),.3); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: var(--blue-h); border-color: var(--blue-h); }
    .btn.danger { color: var(--red); }
    .btn:disabled { opacity: .4; cursor: default; }

    main { max-width: 920px; margin: 0 auto; padding: 22px 20px 80px; }
    .meta { font-size: 12px; color: var(--text-3); margin-bottom: 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    #empty { border: 1px dashed var(--border); background: var(--card); padding: 44px 24px; text-align: center; color: var(--text-2); }
    #empty h2 { font-size: 17px; color: var(--text); margin-bottom: 6px; }
    #empty p { max-width: 460px; margin: 0 auto; font-size: 13px; }

    .step { background: var(--card); border: 1px solid var(--border); margin-bottom: 14px; display: grid; grid-template-columns: 44px 1fr auto; gap: 0 14px; padding: 14px; }
    .num { width: 32px; height: 32px; background: var(--blue); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px; }
    .body { min-width: 0; }
    .step textarea { width: 100%; min-height: 54px; resize: vertical; padding: 8px 10px; font: 400 13.5px 'Archivo', sans-serif; line-height: 1.5; color: var(--text); background: transparent; border: 1px solid var(--border); outline: none; margin-bottom: 10px; }
    .step textarea:focus { border-color: var(--blue); }
    .step textarea::placeholder { color: var(--text-3); }
    .shot { display: block; max-width: 100%; max-height: 520px; border: 1px solid var(--border); background: #fff; }
    .src { font-size: 11px; color: var(--text-3); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ctl { display: flex; flex-direction: column; gap: 4px; }
    .ctl button { width: 30px; height: 30px; background: transparent; border: 1px solid var(--border); color: var(--text-2); cursor: pointer; font-size: 14px; line-height: 1; }
    .ctl button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
    .ctl button:disabled { opacity: .3; cursor: default; }
    .ctl .del:hover:not(:disabled) { color: var(--red); border-color: var(--red); }
    #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #101828; color: #fff; padding: 9px 16px; font-size: 12.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .15s; }
    #toast.show { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { #toast, .btn { transition: none; } }
    @media (max-width: 560px) { .step { grid-template-columns: 36px 1fr; } .ctl { flex-direction: row; grid-column: 2; margin-top: 8px; } }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-in">
      <div class="brand"><i></i>Guide</div>
      <input id="title" type="text" placeholder="Name your guide" maxlength="120" aria-label="Guide title">
      <button class="btn primary" id="exportPdf" type="button">Export PDF</button>
      <button class="btn" id="exportMd" type="button">Markdown + images</button>
      <button class="btn danger" id="clearAll" type="button">Clear</button>
    </div>
  </div>
  <main>
    <div class="meta"><span id="count"></span><span>Stored only on this device</span></div>
    <div id="empty" hidden>
      <h2>Build a step-by-step guide</h2>
      <p>Capture each screen, then choose <b>Add to guide</b> in the editor (Export menu) or <b>Guide</b> on the capture card. Add a line under each step, then export one PDF or a Markdown file with its images.</p>
    </div>
    <div id="steps"></div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="guide.ts"></script>
</body>
</html>
